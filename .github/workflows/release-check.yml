name: Release checks

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      # Main can contain next-release source while the published version stays immutable.
      # Require generated artifacts to match source when a new version is tagged.
      - run: npm run check:dist
        if: startsWith(github.ref, 'refs/tags/v')
